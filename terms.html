<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이용약관</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header-inner">
            <a href="index.html" onclick="if(history.length > 1) { history.back(); return false; }"
                style="color:#fff; text-decoration:none; display:flex; align-items:center; gap:8px;">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M13 4L7 10L13 16" stroke="#fff" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span>돌아가기</span>
            </a>
        </div>
    </header>

    <!-- 메인 -->
    <main class="main-content">
        <div class="container">
            <div class="card-form">
                <h2 style="font-size:1.25rem; color:#1a2a3a; margin-bottom:20px;">이용약관</h2>

                <!-- 로딩 상태 -->
                <div id="termsLoading" style="text-align:center; padding:40px 0;">
                    <div class="spinner" style="width:24px;height:24px;border-width:3px;margin:0 auto 8px;"></div>
                    <p style="font-size:0.8rem;color:#999;">약관 내용을 불러오는 중...</p>
                </div>

                <!-- 약관 내용 영역 -->
                <div id="termsBody" class="terms-body" style="display:none;"></div>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="footer">
        <p>&copy; 2026 All rights reserved.</p>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var termsLoading = document.getElementById('termsLoading');
            var termsBody = document.getElementById('termsBody');

            db.collection('terms_content').doc('main').get()
                .then(function (doc) {
                    termsLoading.style.display = 'none';
                    termsBody.style.display = '';

                    if (doc.exists && doc.data().content) {
                        termsBody.innerHTML = doc.data().content;
                    } else {
                        termsBody.innerHTML = '<p style="color:#999; text-align:center;">등록된 약관 내용이 없습니다.</p>';
                    }
                })
                .catch(function (error) {
                    console.error('약관 내용 로드 실패:', error);
                    termsLoading.style.display = 'none';
                    termsBody.style.display = '';
                    termsBody.innerHTML = '<p style="color:#999; text-align:center;">약관 내용을 불러올 수 없습니다.</p>';
                });
        });
    </script>
</body>

</html>
