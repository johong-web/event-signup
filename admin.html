<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>관리자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- 로그인 화면 -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h2 class="login-title">관리자 로그인</h2>
            <form id="loginForm" novalidate>
                <div class="form-group" style="margin-bottom:12px;">
                    <label class="form-label">아이디</label>
                    <input type="text" id="loginId" class="form-input" placeholder="아이디를 입력하세요" autocomplete="username">
                </div>
                <div class="form-group" style="margin-bottom:16px;">
                    <label class="form-label">비밀번호</label>
                    <input type="password" id="loginPw" class="form-input" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
                </div>
                <span class="form-error" id="loginError">아이디 또는 비밀번호가 올바르지 않습니다.</span>
                <button type="submit" class="btn-submit" style="margin-top:8px;">로그인</button>
            </form>
        </div>
    </div>

    <!-- 관리자 영역 (로그인 후 표시) -->
    <div id="adminArea" style="display:none;">
        <!-- 헤더 -->
        <header class="header">
            <div class="header-inner" style="justify-content:space-between; max-width:800px;">
                <h1 class="logo">관리자 페이지</h1>
                <button id="btnLogout" class="btn-logout">로그아웃</button>
            </div>
        </header>

        <!-- 메인 -->
        <main class="main-content">
            <div class="container" style="max-width:800px;">

                <!-- 탭 네비게이션 -->
                <div class="admin-tabs">
                <button class="admin-tab active" data-tab="requests">신청 내역</button>
                <button class="admin-tab" data-tab="terms">약관 관리</button>
            </div>

            <!-- 탭1: 신청 내역 -->
            <div class="tab-content" id="tabRequests">
                <div class="admin-header">
                    <h2>이벤트 신청 내역</h2>
                    <span class="admin-count" id="totalCount">총 0건</span>
                </div>

                <!-- PC: 테이블 뷰 -->
                <div class="admin-table-wrap" id="tableWrap" style="display:none;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>No.</th>
                                <th>이름</th>
                                <th>연락처</th>
                                <th>신청일시</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                        </tbody>
                    </table>
                </div>

                <!-- 모바일: 카드 뷰 -->
                <div class="admin-cards" id="cardList">
                </div>

                <!-- 로딩 상태 -->
                <div class="empty-state" id="loadingState">
                    <div class="spinner" style="margin:0 auto 16px;"></div>
                    <p>데이터를 불러오는 중...</p>
                </div>

                <!-- 빈 상태 -->
                <div class="empty-state" id="emptyState" style="display:none;">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <circle cx="24" cy="24" r="24" fill="#f0f0f0" />
                        <path d="M16 20h16M16 28h10" stroke="#ccc" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <p>아직 신청 내역이 없습니다.</p>
                </div>
            </div>

            <!-- 탭2: 약관 관리 -->
            <div class="tab-content" id="tabTerms" style="display:none;">
                <div class="admin-header">
                    <h2>약관 항목 관리</h2>
                    <button class="btn-add-term" id="btnAddTerm">+ 항목 추가</button>
                </div>

                <!-- 약관 입력 폼 -->
                <div class="terms-form-wrap" id="termsFormWrap" style="display:none;">
                    <div class="terms-form">
                        <div class="form-group" style="margin-bottom:12px;">
                            <label class="form-label">약관 내용</label>
                            <input type="text" id="termTitle" class="form-input" placeholder="예: 1. 수집하는 개인정보의 항목 및 수집방법">
                        </div>
                        <div class="form-group" style="margin-bottom:12px;">
                            <label class="form-label">상세 내용</label>
                            <textarea id="termContent" class="form-input form-textarea" rows="5" placeholder="예:&#10;- 개인정보파일명: 이벤트 당첨자 개인정보 수집&#10;- 수집 항목: 성명, 전화번호&#10;- 수집 방법: 비밀 댓글, 메시지, 전자우편 등"></textarea>
                        </div>
                        <div class="terms-form-actions">
                            <button type="button" class="btn-term-save" id="btnTermSave">저장</button>
                            <button type="button" class="btn-term-cancel" id="btnTermCancel">취소</button>
                        </div>
                    </div>
                </div>

                <!-- 로딩 상태 -->
                <div class="empty-state" id="termsLoading">
                    <div class="spinner" style="margin:0 auto 16px;"></div>
                    <p>약관 항목을 불러오는 중...</p>
                </div>

                <!-- 약관 항목 리스트 -->
                <div id="termsListContainer"></div>

                <!-- 빈 상태 -->
                <div class="empty-state" id="termsEmpty" style="display:none;">
                    <p>등록된 약관 항목이 없습니다.</p>
                </div>
            </div>

            </div>
        </main>

        <!-- 푸터 -->
        <footer class="footer">
            <p>&copy; 2026 All rights reserved.</p>
        </footer>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
